<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #300148, #5b0086);
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .center-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .status-text {
      font-size: 2rem;
      font-weight: 600;
      color: #f0d8ff;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .mic-btn {
      font-size: 2rem;
      background: none;
      border: 2px solid white;
      color: white;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    .mic-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .facecam {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 160px;
      height: 120px;
      border-radius: 10px;
      border: 2px solid white;
      overflow: hidden;
    }

    .transcript-box {
      position: absolute;
      top: 60px;
      left: 20px;
      width: 350px;
      background: rgba(255, 255, 255, 0.08);
      padding: 1rem;
      border-radius: 10px;
      font-size: 1rem;
      text-align: left;
      overflow: hidden;
      max-height: 120px;
      transition: max-height 0.4s ease;
    }

    .transcript-box.expanded {
      max-height: 80vh;
      overflow-y: auto;
    }

    .transcript-box p {
      margin-bottom: 10px;
    }

    .transcript-user {
      color: #ffebc6;
    }

    .transcript-assistant {
      color: #c3eaff;
    }

    .toggle-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background-color: rgba(255, 255, 255, 0.15);
      border: none;
      padding: 8px 12px;
      color: white;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .toggle-btn:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .back-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
    }
  </style>
</head>

<body>
  <button class="toggle-btn" onclick="toggleTranscript()">📜 Expand/Collapse Chat</button>

  <div class="center-container">
    <div class="status-text" id="status-text">I'm listening</div>
    <button class="mic-btn" onclick="startRecognition()">🎤</button>
  </div>

  <div class="facecam">
    <img src="{{ url_for('video_feed') }}" alt="Facecam Feed" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <div class="transcript-box" id="transcript-box"></div>

  <a href="/" class="btn btn-outline-light back-btn">← Back to Home</a>

  <script>
    let messages = [];

    function toggleTranscript() {
      const box = document.getElementById("transcript-box");
      box.classList.toggle("expanded");
    }

    function appendMessage(role, text) {
      const transcriptBox = document.getElementById("transcript-box");
      const msg = document.createElement("p");
      msg.className = role === "user" ? "transcript-user" : "transcript-assistant";
      msg.innerHTML = `<strong>${role === "user" ? "You" : "Assistant"}:</strong> ${text}`;
      transcriptBox.appendChild(msg);
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
    }

    function startRecognition() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.start();

      document.getElementById("status-text").innerText = "Listening...";

      recognition.onresult = function(event) {
        const userText = event.results[0][0].transcript;
        messages.push({ role: "user", content: userText });
        appendMessage("user", userText);
        document.getElementById("status-text").innerText = "Thinking...";
        sendToServer(userText);
      };

      recognition.onerror = function(event) {
        alert('Speech recognition error: ' + event.error);
        document.getElementById("status-text").innerText = "I'm listening";
      };
    }

    function sendToServer(message) {
      fetch("/chat_api", {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, messages: messages })
      })
      .then(response => response.json())
      .then(data => {
        if (data.reply) {
          messages = data.messages;
          appendMessage("assistant", data.reply);
          speak(data.reply);
          document.getElementById("status-text").innerText = "I'm listening";
        } else {
          document.getElementById("status-text").innerText = "Error. Try again";
          console.error('Error:', data.error);
        }
      });
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1.0;
      speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
