<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Emotion Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fa;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .emotion-section {
      max-width: 1000px;
      margin: auto;
    }

    .card-img-top {
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 0.5rem;
      border-top-right-radius: 0.5rem;
    }

    .card {
      border: none;
      border-radius: 0.5rem;
      transition: transform 0.2s ease-in-out;
    }

    .card:hover {
      transform: scale(1.02);
    }

    .card-header {
      font-weight: bold;
      background-color: #0d6efd;
      color: white;
      border-top-left-radius: 0.5rem;
      border-top-right-radius: 0.5rem;
    }

    #emotion-result {
      font-size: 1.25rem;
      margin-top: 1rem;
      color: #0d6efd;
    }

    hr {
      border-top: 2px dashed #adb5bd;
    }
  </style>
</head>

<body>
  <div class="container py-5 emotion-section text-center">
    <h1 class="mb-4 fw-bold text-primary">🧠 Emotion Detection</h1>

    <div class="mb-4">
      <img src="{{ url_for('video_feed') }}" class="img-fluid rounded shadow border" width="500">
    </div>

    <div class="mb-4">
      <button class="btn btn-danger btn-lg px-4" onclick="detectEmotion()">📸 Analyze My Emotion</button>
    </div>

    <div id="emotion-result" class="fw-semibold"></div>

    <hr class="my-5">

    <h3 class="text-secondary fw-bold mb-3">📸 Emotion History</h3>
    <div id="emotion-cards" class="row gy-4"></div>

    <a href="/" class="btn btn-outline-primary mt-5">← Back to Home</a>
  </div>

  <script>
    let sound = null;

    function playSound() {
      if (sound) {
        sound.pause();
        sound.currentTime = 0;
      }
      sound = new Audio("/static/sounds/sound1.mp3");
      sound.play();
    }

    function stopSound() {
      if (sound) {
        sound.pause();
        sound.currentTime = 0;
      }
    }

    function detectEmotion() {
      document.getElementById("emotion-result").innerText = "Capturing image and analyzing...";
      playSound();

      fetch("/capture_frame", { method: "POST" })
        .then(res => res.json())
        .then(data => {
          const resultText = data.emotion || data.error;
          document.getElementById("emotion-result").innerText = "🧠 Current Emotion: " + resultText;

          loadCards();  // update emotion cards

          // ✅ Speak the one-sentence description from latest entry
          fetch("/emotion_entries")
            .then(res => res.json())
            .then(entries => {
              if (entries.length > 0) {
                const latest = entries[0];
                const utterance = new SpeechSynthesisUtterance(latest.description);
                speechSynthesis.speak(utterance);
              }
            });

          stopSound();
        })
        .catch(err => {
          stopSound();
          document.getElementById("emotion-result").innerText = "Error analyzing image.";
          console.error(err);
        });
    }

    function loadCards() {
      fetch("/emotion_entries")
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById("emotion-cards");
          container.innerHTML = "";

          data.forEach(entry => {
            const card = document.createElement("div");
            card.className = "col-md-4";
            card.innerHTML = `
              <div class="card shadow h-100 bg-light-subtle">
                <div class="card-header d-flex justify-content-between">
                  <span>${entry.keyword}</span>
                  <span class="small">${entry.timestamp}</span>
                </div>
                <img src="${entry.image}" class="card-img-top" alt="Emotion Image">
                <div class="card-body">
                  <p class="text-muted small">${entry.description}</p>
                </div>
              </div>`;
            container.appendChild(card);
          });
        })
        .catch(err => {
          console.error("Error loading emotion entries:", err);
        });
    }

    window.onload = loadCards;
  </script>

</body>

</html>
