<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Assistant Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .chatbox {
      height: 400px;
      overflow-y: auto;
      padding: 1rem;
      border: 1px solid #dee2e6;
      border-radius: 0.5rem;
      background: white;
    }
    .chat-bubble {
      padding: 0.5rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 1rem;
      max-width: 75%;
    }
    .chat-user {
      background-color: #d1e7dd;
      align-self: flex-end;
      text-align: right;
    }
    .chat-assistant {
      background-color: #f8d7da;
      align-self: flex-start;
    }
    .mic-btn {
      font-size: 1.5rem;
      padding: 1rem;
      border-radius: 50%;
      background-color: #0d6efd;
      color: white;
      border: none;
      transition: background-color 0.3s ease;
    }
    .mic-btn:hover {
      background-color: #0b5ed7;
    }
    #mode-buttons button {
      margin-right: 1rem;
    }
    .section {
      display: none;
    }
    .active-section {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">Joshua's Personal Assistant</h1>

    <!-- Mode Switcher -->
    <div id="mode-buttons" class="text-center mb-4">
      <button class="btn btn-primary" onclick="switchMode('chat')">Chat Mode</button>
      <button class="btn btn-warning" onclick="switchMode('emotion')">Emotion Detection</button>
      <button class="btn btn-success" onclick="switchMode('study')">Study Mode</button>
    </div>

    <!-- CHAT MODE -->
    <div id="chat" class="section active-section">
      <div class="row">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header">Live Webcam Feed</div>
            <div class="card-body text-center">
              <img src="{{ url_for('video_feed') }}" class="img-fluid rounded border" width="100%">
            </div>
          </div>
        </div>
        <div class="col-md-6 d-flex flex-column">
          <div class="chatbox d-flex flex-column mb-3" id="chatbox"></div>
          <div class="text-center">
            <button onclick="startRecognition()" class="mic-btn" title="Click to speak">🎤</button>
          </div>
        </div>
      </div>
    </div>

    <!-- EMOTION DETECTION -->
    <div id="emotion" class="section">
      <div class="text-center">
        <h4>Emotion Detection via Webcam</h4>
        <img src="{{ url_for('video_feed') }}" class="img-fluid rounded border" width="480">
        <div class="mt-3">
          <button class="btn btn-danger" onclick="captureEmotion()">Capture Emotion</button>
        </div>
        <div class="mt-3" id="emotion-result" style="font-weight: bold;"></div>
      </div>
    </div>

    <!-- STUDY MODE -->
    <div id="study" class="section">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h4 class="mb-3 text-center">Study Buddy</h4>
          <input type="text" id="studyTopic" class="form-control mb-3" placeholder="Enter topic to study (e.g., Photosynthesis)">
          <div class="text-center">
            <button class="btn btn-success" onclick="startStudy()">Start Study Session</button>
          </div>
          <div class="mt-3" id="study-output" style="white-space: pre-wrap;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chatbox = document.getElementById("chatbox");
    let messages = [];

    function switchMode(mode) {
      document.querySelectorAll('.section').forEach(section => section.classList.remove('active-section'));
      document.getElementById(mode).classList.add('active-section');
    }

    function startRecognition() {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.start();

      recognition.onresult = function(event) {
        const userText = event.results[0][0].transcript;
        displayMessage('You', userText, 'chat-user');
        sendToServer(userText);
      };

      recognition.onerror = function(event) {
        alert('Speech recognition error: ' + event.error);
      };
    }

    function displayMessage(sender, message, cssClass) {
      const div = document.createElement('div');
      div.classList.add('chat-bubble', cssClass);
      div.innerHTML = `<strong>${sender}:</strong> ${message}`;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1.0;
      speechSynthesis.speak(utterance);
    }

    function sendToServer(message) {
      fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, messages: messages })
      })
      .then(response => {
        if (!response.ok) throw new Error("Server error");
        return response.json();
      })
      .then(data => {
        if (data.reply) {
          messages = data.messages;
          displayMessage('Assistant', data.reply, 'chat-assistant');
          speak(data.reply);
        } else if (data.error) {
          alert("GPT Error: " + data.error);
        }
      })
      .catch(err => {
        alert("Fetch error: " + err.message);
      });
    }

    function captureEmotion() {
      document.getElementById("emotion-result").innerText = "Analyzing image...";
      fetch("/capture_frame", { method: "POST" })
        .then(response => response.json())
        .then(data => {
          if (data.emotion) {
            document.getElementById("emotion-result").innerText = "🤖 " + data.emotion;
            speak(data.emotion);
          } else {
            document.getElementById("emotion-result").innerText = "Error: " + data.error;
          }
        });
    }

    function startStudy() {
      const topic = document.getElementById("studyTopic").value;
      if (!topic) return alert("Please enter a topic.");

      fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Help me study the topic: ${topic}. Break it down simply like you're tutoring me.`,
          messages: []
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.reply) {
          document.getElementById("study-output").innerText = data.reply;
          speak(data.reply);
        } else {
          document.getElementById("study-output").innerText = "Error: " + data.error;
        }
      });
    }
  </script>
</body>
</html>
